[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-raw-image-processing"
version = "0.1.0"
description = "Image processing and benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "rubennmg" }]
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
exclude = [
    "tests*",
    "images",
    "profiles",
    "__pycache__",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["."]
